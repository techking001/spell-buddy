<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Practice · Spell Buddy</title>
  <link rel="icon" href="assets/bee.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/practice.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/icons.css">
</head>
<body>
<header id="site-header" class="site-header"></header>
<main class="container">

  <section id="loading" class="card" aria-busy="true">
    <span class="skeleton block"></span>
    <span class="skeleton line"></span>
    <span class="skeleton line"></span>
  </section>

  <section id="ready" class="card ready-card" hidden>
    <img class="mascot bob" src="assets/bee.svg" width="110" height="119" alt="">
    <h1>Ready?</h1>
    <p id="readyInfo" class="muted"></p>
    <p id="speechWarning" class="warn" hidden>This browser cannot speak words aloud. Try Chrome, Edge or Safari.</p>
    <button id="beginBtn" class="btn primary big" type="button">
      <svg class="icon fill" aria-hidden="true" focusable="false"><use href="assets/icons.svg#play"/></svg>
      <span>Begin</span>
    </button>
  </section>

  <section id="play" class="card" hidden>
    <div class="session-top">
      <button id="endBtn" class="btn small ghost" type="button">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#x-circle"/></svg>
        <span>End session</span>
      </button>
      <span id="progress" class="pill"></span>
    </div>
    <div id="progressTrack" class="bar purple" role="progressbar" aria-label="Progress through the word list" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span id="barFill" class="bar-fill"></span>
    </div>
    <p id="liveStats" class="live-stats" role="status"></p>

    <p class="prompt">Listen to the word</p>
    <button id="hearBtn" class="speaker" type="button" aria-label="Hear the word">
      <span class="speaker-icon" aria-hidden="true"><svg class="icon" focusable="false"><use href="assets/icons.svg#volume"/></svg></span>
      <span>Tap to hear the word</span>
    </button>

    <div class="helpers">
      <button id="meaningBtn" class="btn small" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#book"/></svg><span>Meaning</span></button>
      <button id="sentenceBtn" class="btn small" type="button"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#message"/></svg><span>Sentence</span></button>
      <button id="originBtn" class="btn small" type="button" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#globe"/></svg><span>Origin</span></button>
    </div>
    <p id="aidText" class="aid" hidden></p>

    <label for="answer" class="muted">Type your spelling here</label>
    <input id="answer" class="answer" type="text" placeholder="Enter your answer…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    <button id="actionBtn" class="btn primary big" type="button">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#check"/></svg>
      <span>Check answer</span>
    </button>
    <p class="tip">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#lightbulb"/></svg>
      <span>Listen carefully and type the word exactly as you hear it.</span>
    </p>
  </section>

  <section id="done" class="card center" hidden>
    <img class="mascot bob" src="assets/bee.svg" width="90" height="97" alt="">
    <h2>Session summary</h2>
    <p id="summaryMsg" class="muted"></p>
    <div class="sum-grid">
      <div class="sum"><strong id="sumAttempts">0</strong><span>Attempts</span></div>
      <div class="sum good"><strong id="sumCorrect">0</strong><span>Correct</span></div>
      <div class="sum warm"><strong id="sumIncorrect">0</strong><span>Incorrect</span></div>
      <div class="sum"><strong id="sumAccuracy">—</strong><span>Accuracy</span></div>
    </div>
    <p id="sumRounds" class="muted" hidden></p>
    <div id="missedBox" hidden>
      <h2>Words to practise</h2>
      <ul id="missedList" class="missed missed-scroll"></ul>
    </div>
    <a id="playAgain" class="btn primary big" href="practice.html">Practise again</a>
    <a class="btn big ghost" href="index.html">Home</a>
  </section>

  <section id="error" class="card" hidden>
    <p id="errorMsg"></p>
    <a class="btn primary" href="index.html">Back home</a>
  </section>

</main>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/practice.js"></script>
</body>
</html>
